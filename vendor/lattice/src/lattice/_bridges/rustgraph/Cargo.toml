[package]
name = "rustgraph"
version = "0.1.0"
edition = "2021"

# Structural-graph bridge: per Rust file, emit symbols (with lines, visibility,
# stub flags, impl containment), mod/use imports, and call sites as JSON for
# src/lattice/ingest/rust_graph.py. Deliberately a separate crate from
# the packaged rustast taint bridge so the two evolve independently.

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
